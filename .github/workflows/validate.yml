name: Validar aplicación

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validar lector canónico de pedidos
        run: |
          php artifacts/tests/test-canonical-order-reader-1a.php
          php artifacts/tests/test-canonical-order-reader-history-truncation-1a.php

      - name: Validar historial canónico de eventos
        run: php artifacts/tests/test-canonical-order-events-1b.php

      - name: Validar servicio único de transiciones
        run: php artifacts/tests/test-order-transition-service-1c.php

      - name: Validar contrato del Centro Único
        run: node artifacts/tests/test-order-center-2a.mjs

      - name: Validar contrato del Centro Operativo del Mensajero
        run: |
          node artifacts/tests/test-messenger-center-2d.mjs
          node artifacts/tests/test-messenger-operational-fields.mjs

      - name: Validar contrato de navegación móvil del cliente
        run: node artifacts/tests/test-customer-navigation-3a.mjs

      - name: Validar contrato de Pedidos del cliente
        run: node artifacts/tests/test-customer-orders-3b.mjs

      - name: Validar contrato del detalle del pedido del cliente
        run: node artifacts/tests/test-customer-order-detail-3c.mjs

      - name: Validar contrato de seguimiento en vivo del cliente
        run: node artifacts/tests/test-customer-live-tracking-3d.mjs

      - name: Validar contrato de ayuda contextual del cliente
        run: node artifacts/tests/test-customer-order-support-3e.mjs

      - name: Validar privacidad dependienta y administración
        run: node artifacts/tests/test-staff-privacy-5a.mjs

      - name: Validar contrato de recogida en tienda
        run: node artifacts/tests/test-store-pickup-5b.mjs

      - name: Validar contrato de integridad de inventario
        run: node artifacts/tests/test-inventory-integrity-5c.mjs

      - name: Validar contrato de incidencias operativas estructuradas
        run: node artifacts/tests/test-structured-incidents-5d.mjs

      - name: Validar contratos field-ready de mensajería
        run: |
          node artifacts/tests/test-messenger-contact-events.mjs
          node artifacts/tests/test-messenger-delivery-collection.mjs
          node artifacts/tests/test-voucher-intake-contract.mjs
          node artifacts/tests/test-shipping-quote-contract.mjs
          node artifacts/tests/test-split-payment-obligations.mjs
          node artifacts/tests/test-gestora-messenger-dispatch.mjs

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar lint
        run: npm run lint

      - name: Comprobar TypeScript
        run: npm run typecheck

      - name: Compilar aplicación
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar integración WordPress y MariaDB
        run: scripts/integration.sh test

      - name: Validar panel financiero de gestora
        run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/gestora-dashboard-4d.php

      - name: Validar integridad de precios espejo
        run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/gestora-mirror-price-integrity-4e.php

      - name: Validar reasignación auditable de gestora
        run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/gestora-attribution-reassignment-4h.php

      - name: Validar notificaciones y enlaces directos
        run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/notifications-direct-links.php

      - name: Validar privacidad operativa de dependienta
        run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/staff-privacy-5a.php

      - name: Validar recogida en tienda canónica
        run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/store-pickup-5b.php

      - name: Validar integridad y reconciliación de inventario
        run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/inventory-integrity-5c.php

      - name: Validar incidencias operativas estructuradas
        run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/structured-incidents-5d.php

      - name: Validar jornada field-ready
        run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/field-ready-messaging.php

      - name: Validar cobro y pagador dividido
        run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/split-payment-obligations.php

      - name: Mostrar diagnóstico si falla
        if: failure()
        run: scripts/integration.sh logs

      - name: Eliminar entorno desechable
        if: always()
        run: scripts/integration.sh down

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save @playwright/test@1.54.2
          npx playwright install --with-deps chromium

      - name: Levantar WordPress y preparar fixtures visuales
        shell: bash
        run: |
          set -euo pipefail
          scripts/integration.sh up
          compose=(docker compose -f integration/compose.yml)
          bootstrap_json="$("${compose[@]}" run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/bootstrap.php | tail -n 1)"
          fixture_json="$("${compose[@]}" run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/order-center-browser.php | tail -n 1)"
          messenger_json="$("${compose[@]}" run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/messenger-center-browser.php | tail -n 1)"
          customer_orders_json="$("${compose[@]}" run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/customer-orders-browser.php | tail -n 1)"
          gestora_portal_json="$("${compose[@]}" run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/gestora-portal-browser-4f.php | tail -n 1)"
          inventory_json="$("${compose[@]}" run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/inventory-integrity-browser.php | tail -n 1)"
          voucher_json="$("${compose[@]}" run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/voucher-intake-browser.php | tail -n 1)"
          echo "$bootstrap_json" | jq -e . >/dev/null
          echo "$fixture_json" | jq -e . >/dev/null
          echo "$messenger_json" | jq -e . >/dev/null
          echo "$customer_orders_json" | jq -e . >/dev/null
          echo "$gestora_portal_json" | jq -e . >/dev/null
          echo "$inventory_json" | jq -e . >/dev/null
          echo "$voucher_json" | jq -e . >/dev/null
          {
            echo "ORDER_CENTER_BASE_URL=http://localhost:8889"
            echo "CUSTOMER_NAV_PRODUCT_ID=$(echo "$bootstrap_json" | jq -r .product_id)"
            echo "ORDER_CENTER_PAGE_ID=$(echo "$fixture_json" | jq -r .page_id)"
            echo "ORDER_CENTER_SALES_PAGE_ID=$(echo "$fixture_json" | jq -r .sales_page_id)"
            echo "ORDER_CENTER_NEW_ID=$(echo "$fixture_json" | jq -r .new_id)"
            echo "ORDER_CENTER_READY_ID=$(echo "$fixture_json" | jq -r .ready_id)"
            echo "ORDER_CENTER_PICKUP_ID=$(echo "$fixture_json" | jq -r .pickup_id)"
            echo "ORDER_CENTER_INCIDENT_ID=$(echo "$fixture_json" | jq -r .incident_id)"
            echo "ORDER_CENTER_HANDED_ID=$(echo "$fixture_json" | jq -r .handed_id)"
            echo "ORDER_CENTER_CONFLICT_ID=$(echo "$fixture_json" | jq -r .conflict_id)"
            echo "ORDER_CENTER_ADMIN_USER=$(echo "$fixture_json" | jq -r .admin_user)"
            echo "ORDER_CENTER_ADMIN_PASSWORD=$(echo "$fixture_json" | jq -r .admin_password)"
            echo "ORDER_CENTER_CLERK_USER=$(echo "$fixture_json" | jq -r .clerk_user)"
            echo "ORDER_CENTER_CLERK_PASSWORD=$(echo "$fixture_json" | jq -r .clerk_password)"
            echo "MESSENGER_CENTER_PAGE_ID=$(echo "$messenger_json" | jq -r .page_id)"
            echo "MESSENGER_CENTER_ORDER_ID=$(echo "$messenger_json" | jq -r .order_id)"
            echo "MESSENGER_CENTER_USER=$(echo "$messenger_json" | jq -r .messenger_user)"
            echo "MESSENGER_CENTER_PASSWORD=$(echo "$messenger_json" | jq -r .messenger_pass)"
            echo "CUSTOMER_ORDERS_RELATIVE=$(echo "$customer_orders_json" | jq -r .orders_relative)"
            echo "CUSTOMER_ORDERS_USER=$(echo "$customer_orders_json" | jq -r .user)"
            echo "CUSTOMER_ORDERS_PASSWORD=$(echo "$customer_orders_json" | jq -r .password)"
            echo "CUSTOMER_ORDERS_ACTIVE_ID=$(echo "$customer_orders_json" | jq -r .active_id)"
            echo "CUSTOMER_ORDERS_FINISHED_ID=$(echo "$customer_orders_json" | jq -r .finished_id)"
            echo "GESTORA_PORTAL_RELATIVE=$(echo "$gestora_portal_json" | jq -r .portal_relative)"
            echo "GESTORA_PORTAL_A_USER=$(echo "$gestora_portal_json" | jq -r .a_user)"
            echo "GESTORA_PORTAL_A_PASSWORD=$(echo "$gestora_portal_json" | jq -r .a_password)"
            echo "GESTORA_PORTAL_A_CLIENT=$(echo "$gestora_portal_json" | jq -r .a_client)"
            echo "GESTORA_PORTAL_A_ORDER_ID=$(echo "$gestora_portal_json" | jq -r .a_order_id)"
            echo "GESTORA_PORTAL_B_USER=$(echo "$gestora_portal_json" | jq -r .b_user)"
            echo "GESTORA_PORTAL_B_PASSWORD=$(echo "$gestora_portal_json" | jq -r .b_password)"
            echo "GESTORA_PORTAL_B_CLIENT=$(echo "$gestora_portal_json" | jq -r .b_client)"
            echo "GESTORA_PORTAL_B_ORDER_ID=$(echo "$gestora_portal_json" | jq -r .b_order_id)"
            echo "INVENTORY_PAGE_ID=$(echo "$inventory_json" | jq -r .page_id)"
            echo "INVENTORY_PRODUCT_CODE=$(echo "$inventory_json" | jq -r .product_code)"
            echo "VOUCHER_INTAKE_PAGE_ID=$(echo "$voucher_json" | jq -r .page_id)"
          } >> "$GITHUB_ENV"

      - name: Ejecutar validación visual real
        shell: bash
        run: |
          set -o pipefail
          # All browser tests share one disposable WordPress database. Running them serially
          # prevents concurrent login writes from creating false wp-login.php timeouts.
          npx playwright test tests/browser --workers=1 --reporter=line 2>&1 | tee playwright-output.log

      - name: Subir diagnóstico del navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.run_id }}
          path: |
            playwright-output.log
            test-results/**/*.png
            test-results/**/*.txt
            test-results/**/*.webm
          if-no-files-found: warn
          retention-days: 14

      - name: Mostrar diagnóstico si falla
        if: failure()
        run: scripts/integration.sh logs

      - name: Eliminar entorno desechable
        if: always()
        run: scripts/integration.sh down
