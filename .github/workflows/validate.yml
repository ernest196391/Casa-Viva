name: Validar aplicación

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validar lector canónico de pedidos
        run: |
          php artifacts/tests/test-canonical-order-reader-1a.php
          php artifacts/tests/test-canonical-order-reader-history-truncation-1a.php

      - name: Validar historial canónico de eventos
        run: php artifacts/tests/test-canonical-order-events-1b.php

      - name: Validar servicio único de transiciones
        run: php artifacts/tests/test-order-transition-service-1c.php

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar lint
        run: npm run lint

      - name: Comprobar TypeScript
        run: npm run typecheck

      - name: Compilar aplicación
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar integración WordPress y MariaDB
        run: scripts/integration.sh test

      - name: Mostrar diagnóstico si falla
        if: failure()
        run: scripts/integration.sh logs

      - name: Eliminar entorno desechable
        if: always()
        run: scripts/integration.sh down
