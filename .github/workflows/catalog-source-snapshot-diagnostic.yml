name: Diagnóstico snapshot BizneCubano

on:
  push:
    branches: ['cv-catalog-sync-refresh-20261112']
    paths:
      - 'scripts/catalog/biznecubano-snapshot.mjs'
      - '.github/workflows/catalog-source-snapshot-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: catalog-source-snapshot-diagnostic
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT_DIR: catalog-snapshot
      DISCOVERY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save @playwright/test@1.54.2
          npx playwright install --with-deps chromium
      - name: Extraer catálogo actual de BizneCubano (solo lectura)
        shell: bash
        run: node scripts/catalog/biznecubano-snapshot.mjs 2>&1 | tee catalog-snapshot.log
      - name: Publicar evidencia separada
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog-snapshot
          cp catalog-snapshot.log catalog-snapshot/ 2>/dev/null || true
          cd catalog-snapshot
          git init -q -b evidence
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "evidence: diagnostic snapshot ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/evidence/catalog-snapshot-diag-20261112
