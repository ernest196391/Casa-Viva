name: Verificar en lectura el panel de Casa Viva
on:
  push:
    branches: [codex/auditoria-zayri-lectura-20261103]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar conexión existente a Casa Viva
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '\n' >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Comparar cuatro archivos del panel y consultar acceso y propuesta privada
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          set -euo pipefail
          root=/home/u824654880/domains/casaviva.company/public_html
          (cd wordpress/casa-viva-dropship-core && sha256sum assets/content-studio.js assets/product-background.js includes/class-cvd-content-studio.php includes/class-cvd-photo-ai.php) | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$root/wp-content/plugins/casa-viva-dropship-core' && sha256sum -c -"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$root' && wp eval-file -" < audit-read.php
