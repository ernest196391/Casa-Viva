name: Control OS Auto Deploy

on:
  workflow_run:
    workflows: ["Validar aplicación"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  guard:
    # SAFETY STOP: producción está por delante de Git (live 3.14.167 vs repo 3.14.156).
    # Se reactivará después de reconciliar el Core vivo hacia Git.
    if: ${{ false }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Checkout validated SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Allow only Control OS task commits
        id: check
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          msg="$(git log -1 --pretty=%B)"
          if echo "$msg" | grep -Eq '^Control OS task #[0-9]+ \[risk=(safe|guarded)\] .*\[auto_merge=1\]'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: guard
    if: needs.guard.outputs.deploy == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-prototype.yml
    with:
      expected_sha: ${{ needs.guard.outputs.sha }}
    secrets: inherit
