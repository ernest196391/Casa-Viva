name: Auditoría integral del panel de Zayri en WordPress desechable
on:
  push:
    branches: [codex/auditoria-integral-zayri-20261103]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: scripts/integration.sh up
      - run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/content-studio.php
      - run: docker compose -f integration/compose.yml run --rm --no-deps cli wp eval-file /var/www/html/integration-tests/content-studio-browser.php
      - run: npm install --no-save @playwright/test@1.54.2 && npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/auditoria-zayri.spec.js --workers=1 --reporter=line
      - if: always()
        run: scripts/integration.sh down
