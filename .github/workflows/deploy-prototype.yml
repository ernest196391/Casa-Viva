name: Deploy prototype Casa Viva

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA completo de main que se desea desplegar
        required: true
        type: string

permissions:
  contents: read

env:
  WP_PATH: /home/u824654880/domains/casavivadecuba.com/public_html
  PLUGIN_SLUG: casa-viva-dropship-core
  PROTOTYPE_URL: https://casavivadecuba.com

jobs:
  deploy-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar SHA solicitado
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verificar que el SHA pertenece a main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=200
          git merge-base --is-ancestor "${{ inputs.expected_sha }}" origin/main

      - name: Verificar CI post-merge exitoso
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ inputs.expected_sha }}"
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&branch=main&event=push&per_page=50")"
          conclusion="$(jq -r '[.workflow_runs[] | select(.name == "Validar aplicación" and .conclusion == "success")] | length' <<<"$runs")"
          test "$conclusion" -ge 1

      - name: Construir release reproducible
        shell: bash
        env:
          GITHUB_REF_NAME: main
        run: bash scripts/build-release-candidate.sh release

      - name: Verificar checksum local
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS

      - name: Preparar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copiar release al servidor
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          set -euo pipefail
          archive="$(jq -r '.archive' release/release-manifest.json)"
          scp -P "$SSH_PORT" "release/$archive" release/release-manifest.json release/SHA256SUMS "$SSH_USER@$SSH_HOST:/tmp/"

      - name: Desplegar plugin de forma controlada
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "WP_PATH='$WP_PATH' PLUGIN_SLUG='$PLUGIN_SLUG' EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          manifest=/tmp/release-manifest.json
          archive="$(python3 -c 'import json; print(json.load(open("/tmp/release-manifest.json"))["archive"])')"
          archive_sha="$(python3 -c 'import json; print(json.load(open("/tmp/release-manifest.json"))["archive_sha256"])')"
          source_sha="$(python3 -c 'import json; print(json.load(open("/tmp/release-manifest.json"))["source_sha"])')"
          test "$source_sha" = "$EXPECTED_SHA"
          printf '%s  %s\n' "$archive_sha" "/tmp/$archive" | sha256sum -c -

          plugins_dir="$WP_PATH/wp-content/plugins"
          current="$plugins_dir/$PLUGIN_SLUG"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$plugins_dir/${PLUGIN_SLUG}.predeploy-${stamp}"
          temp="$plugins_dir/.${PLUGIN_SLUG}.deploy-${stamp}"

          rm -rf "$temp"
          mkdir -p "$temp"
          unzip -q "/tmp/$archive" -d "$temp"
          test -f "$temp/$PLUGIN_SLUG/casa-viva-dropship-core.php"

          if [ -d "$current" ]; then
            mv "$current" "$backup"
          fi
          mv "$temp/$PLUGIN_SLUG" "$current"
          rmdir "$temp" 2>/dev/null || true

          cd "$WP_PATH"
          wp plugin is-installed "$PLUGIN_SLUG"
          wp plugin activate "$PLUGIN_SLUG" --quiet
          wp plugin status "$PLUGIN_SLUG"
          wp plugin get "$PLUGIN_SLUG" --field=version

          printf '%s\n' "$EXPECTED_SHA" > "$current/.cvd-deployed-sha"
          printf '%s\n' "$archive_sha" > "$current/.cvd-deployed-archive-sha256"
          REMOTE

      - name: Verificar identidad desplegada
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          set -euo pipefail
          deployed="$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cat '$WP_PATH/wp-content/plugins/$PLUGIN_SLUG/.cvd-deployed-sha'")"
          test "$deployed" = "${{ inputs.expected_sha }}"

      - name: Ejecutar smoke tests contra prototipo
        shell: bash
        run: bash scripts/smoke-staging.sh "$PROTOTYPE_URL"

      - name: Resumen
        if: always()
        shell: bash
        run: |
          {
            echo "## Deploy prototipo Casa Viva"
            echo "- URL: $PROTOTYPE_URL"
            echo "- SHA solicitado: ${{ inputs.expected_sha }}"
            echo "- Resultado: ${{ job.status }}"
            echo "- Unidad desplegada: $PLUGIN_SLUG"
          } >> "$GITHUB_STEP_SUMMARY"
