name: Aserezon · importar borradores controlados

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (revisión) o apply (crea solo nuevos borradores ocultos)"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]

permissions:
  contents: read

concurrency:
  group: cvd-aserezon-drafts
  cancel-in-progress: false

env:
  WP_PATH: /home/u824654880/domains/casaviva.company/public_html

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar datos y sintaxis antes de acceso remoto
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/catalog/import-aserezon-drafts.php
          jq -e '.supplier == "Aserezon" and .status == "PREPARE - NO PUBLICAR" and (.items|length) > 0 and all(.items[]; .status=="draft" and .image_url==null and .stock=="unverified")' data/catalog/aserezon-piloto-borrador.json > /dev/null
      - name: Preparar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Ejecutar importador (sin publicar)
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test "$MODE" = "dry-run" || test "$MODE" = "apply"
          scp -P "$SSH_PORT" data/catalog/aserezon-piloto-borrador.json "$SSH_USER@$SSH_HOST:/tmp/cvd-aserezon-pilot.json"
          scp -P "$SSH_PORT" scripts/catalog/import-aserezon-drafts.php "$SSH_USER@$SSH_HOST:/tmp/cvd-import-aserezon-drafts.php"
          ssh -o ServerAliveInterval=30 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$WP_PATH' && CVD_ASEREZON_FILE=/tmp/cvd-aserezon-pilot.json CVD_ASEREZON_MODE='$MODE' wp eval-file /tmp/cvd-import-aserezon-drafts.php" > raw-output.txt
          sed -n '/^{/,$p' raw-output.txt > report.json
          jq -e '.mode and .created and .skipped and (.errors | length == 0)' report.json > /dev/null
          jq -r '"::notice title=Aserezon borradores::creados=\(.created|length), omitidos=\(.skipped|length), errores=\(.errors|length)"' report.json
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aserezon-import-${{ github.run_id }}
          path: |
            report.json
            raw-output.txt
          if-no-files-found: ignore
          retention-days: 14
