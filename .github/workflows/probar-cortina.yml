name: Vista previa privada de Cloudflare desde el perfil de Zayri
on:
  push:
    branches: [codex/comparar-fondo-cortinero-01]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probar el generador y cifrar la vista previa
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd /home/u824654880/domains/casaviva.company/public_html && wp eval-file -" < scripts/ops/verificar-cortina.php > "$RUNNER_TEMP/preview.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import sys, json,base64,os
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives import hashes,serialization
          raw=(Path(sys.argv[1])/'preview.json').read_bytes()
          d=json.loads(raw)
          assert len(d['preview'])>300 and len(d['original'])>300
          pk=serialization.load_pem_public_key(Path('scripts/ops/preview-public.pem').read_bytes())
          key=AESGCM.generate_key(bit_length=256); nonce=os.urandom(12)
          enc=pk.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA1()),algorithm=hashes.SHA1(),label=None))+nonce+AESGCM(key).encrypt(nonce,raw,None)
          out=base64.b64encode(enc).decode()
          for i in range(0,len(out),4000): print('CV_ENVELOPE_'+str(i)+'='+out[i:i+4000])
          print('Foto de referencia y edición verificadas.')
          PY
