name: Validate WhatsApp incident digest
on:
  pull_request:
    paths:
      - 'scripts/ops/github_contingency.py'
      - 'scripts/ops/test_wa_incident_digest.py'
      - '.github/workflows/wa-incident-digest.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ops/github_contingency.py'
      - 'scripts/ops/test_wa_incident_digest.py'
      - '.github/workflows/wa-incident-digest.yml'
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run aggregate privacy and deduplication fixtures
        working-directory: scripts/ops
        run: python3 -m unittest -v test_wa_incident_digest
