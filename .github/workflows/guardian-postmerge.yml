name: Guardian post-merge evidence
on:
  pull_request:
    paths:
      - 'scripts/ops/guardian_postmerge.py'
      - 'scripts/ops/test_guardian_postmerge.py'
      - 'scripts/ops/github_release_gate.py'
      - 'scripts/ops/github_contingency.py'
      - 'scripts/ops/tests/github-contingency.test.py'
      - '.github/workflows/guardian-postmerge.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v test_guardian_postmerge
        working-directory: scripts/ops
  evidence:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and publish exact commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        working-directory: scripts/ops
        run: |
          set -eu
          state=failure
          for attempt in $(seq 1 10); do
            if python3 guardian_postmerge.py; then state=success; break; fi
            if [ "$attempt" != 10 ]; then sleep 45; fi
          done
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" -f context="guardian/postmerge" \
            -f description="Exact protected main push checks: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$state" = success
