name: Validar contrato de staging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  staging-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Validar contrato 6B de smoke
        run: node artifacts/tests/test-staging-smoke-6b.mjs
      - name: Validar contrato 6B de deploy al prototipo
        run: node artifacts/tests/test-prototype-deploy-6b.mjs
      - name: Preparar SSH de verificación
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '\n' >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Esperar hotfix 3.10.2 desplegado
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          set -euo pipefail
          WP_PATH=/home/u824654880/domains/casavivadecuba.com/public_html
          PLUGIN_SLUG=casa-viva-dropship-core
          EXPECTED_SHA=38a2a07a569309e019bea9a8d2cac3e5772b392c
          for attempt in {1..72}; do
            deployed="$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cat '$WP_PATH/wp-content/plugins/$PLUGIN_SLUG/.cvd-deployed-sha' 2>/dev/null || true")"
            version="$(ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$WP_PATH' && wp plugin get '$PLUGIN_SLUG' --field=version 2>/dev/null || true")"
            if [ "$deployed" = "$EXPECTED_SHA" ] && [ "$version" = "3.10.2" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Producción no alcanzó SHA $EXPECTED_SHA / Core 3.10.2" >&2
          exit 1
      - name: Smoke real de producción
        run: bash scripts/smoke-staging.sh https://casavivadecuba.com
